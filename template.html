<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <meta name="description" content="{{title}}">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Playfair+Display:wght@400;600;700&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                             --brand-blue: #0056b3, /* Your Brand Red */
                            dark: '#0f172a',
                            light: '#f8fafc'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Oswald', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            /* I mapped this to your brand RED so it matches the rest of the site */
            --brand-color: #ef4444; 
            --brand-blue: #0056b3; /* Kept your blue for specific text if needed */
        }

        /* Article Typography Overrides */
        .article-content h1,
        .article-content h2,
        .article-content h3,
        .article-content h4 {
            font-family: 'Playfair Display', serif;
            color: #111827;
            line-height: 1.3;
        }

        .article-content p {
            font-family: 'Merriweather', serif;
            font-size: 1.125rem; /* 18px */
            line-height: 1.9;
            color: #374151;
            margin-bottom: 2rem;
        }

        .article-content h2 {
            font-size: 1.875rem; /* 30px */
            font-weight: 700;
            margin-top: 3.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #f3f4f6;
            padding-bottom: 0.5rem;
        }

        .article-content h3 {
            font-size: 1.5rem; /* 24px */
            font-weight: 600;
            color: #1f2937;
            margin-top: 2.5rem;
            margin-bottom: 1rem;
        }

        .article-content ul {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin-bottom: 2rem;
            font-family: 'Merriweather', serif;
            color: #374151;
        }

        .article-content li {
            margin-bottom: 1rem;
        }

        .article-content strong {
            color: #111827;
            font-weight: 700;
        }

        /* Drop Cap Style */
        .drop-cap::first-letter {
            font-size: 4rem;
            font-weight: 700;
            float: left;
            margin-right: 0.75rem;
            line-height: 0.8;
            color: var(--brand-color);
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>

<body class="bg-white text-slate-600 antialiased font-sans flex flex-col min-h-screen">

    <nav class="fixed w-full z-50 bg-white/95 backdrop-blur-md shadow-sm border-b border-gray-100 h-20 flex items-center">
        <div class="max-w-7xl mx-auto px-4 w-full flex justify-between items-center">
            <a href="../index.html" class="text-2xl font-heading font-bold text-brand-dark no-underline">
                BIM <span class="text-brand-accent">Services India</span>
            </a>
            <div class="hidden md:flex gap-8 font-medium text-sm uppercase tracking-wide">
                <a href="../index.html" class="hover:text-brand-accent transition no-underline">Home</a>
                <a href="../blog.html" class="text-brand-accent font-bold no-underline">Blog</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow pt-32 pb-20 px-4">
        <article class="max-w-3xl mx-auto">
            
            <div class="text-xs font-bold text-gray-400 mb-6 uppercase tracking-wider flex items-center gap-2 font-sans">
                <a href="../blog.html" class="hover:text-brand-accent no-underline">Blog</a> 
                <i class="fas fa-chevron-right text-[8px]"></i>
                <span class="text-brand-accent">Article</span>
            </div>

            <h1 class="text-4xl md:text-5xl font-bold text-gray-900 leading-tight mb-6" style="font-family: 'Playfair Display', serif;">
                {{title}}
            </h1>

            <div class="flex items-center gap-6 text-sm text-gray-400 font-medium mb-8 border-b border-gray-100 pb-8 font-sans">
                <span><i class="far fa-user mr-2 text-brand-accent"></i> AI Author</span>
                <span><i class="far fa-calendar mr-2 text-brand-accent"></i> Today</span>
            </div>

            <div class="w-full mb-12 overflow-hidden rounded-xl shadow-lg bg-gray-100">
                <img src="{{banner_image}}" alt="{{title}}" class="w-full h-auto object-cover transform hover:scale-105 transition duration-700">
            </div>

            <div class="article-content">
                <div class="drop-cap">
                    {{content}}
                </div>
            </div>

        </article>
    </main>

    <footer class="bg-brand-dark text-gray-400 py-12 text-center text-sm font-sans">
        <div class="max-w-7xl mx-auto px-6">
            <p>&copy; 2026 BIM Services India. All Rights Reserved.</p>
        </div>
    </footer>

</body>
</html>
